<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velvet Vault | All Your Favorites in One Place</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/favorites.css') }}" />
</head>
<body>
    <header class="topbar">
        <div class="brand-block">
            <p class="brand-kicker">Curated luxury dashboard</p>
            <h1>Velvet Vault</h1>
        </div>
        <button id="quick-sort" class="ghost-btn">Sort by latest save</button>
    </header>

    <main class="page">
        <section class="intro-card">
            <h2>Your favorites from every platform. One polished place.</h2>
            <p>
                Designed for speed: <strong>click once to filter</strong>, and <strong>click once to open</strong>.
                No clutter. No endless tabs.
            </p>
            <div class="quick-actions">
                <button class="primary-btn">Add favorite</button>
                <button class="secondary-btn">Sync platforms</button>
            </div>
        </section>

        <section class="filter-row" aria-label="Platform filters">
            <button class="chip active" data-platform="all">All</button>
            <button class="chip" data-platform="Amazon">Amazon</button>
            <button class="chip" data-platform="Flipkart">Flipkart</button>
            <button class="chip" data-platform="Myntra">Myntra</button>
            <button class="chip" data-platform="Ajio">Ajio</button>
        </section>

        <section>
            <div class="section-title-row">
                <h3>Favorites Collection</h3>
                <span id="count" class="count-pill">0 items</span>
            </div>

            <div id="products" class="product-grid" aria-live="polite"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/favorites.js') }}"></script>
</body>
</html>
